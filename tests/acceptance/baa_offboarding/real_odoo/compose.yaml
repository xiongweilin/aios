name: aios-real-odoo-offboarding

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${BAA_ODOO_DB_PASSWORD:?set BAA_ODOO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  init:
    image: odoo:18.0
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${BAA_ODOO_DB_PASSWORD:?set BAA_ODOO_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - odoo-data:/var/lib/odoo
    command:
      - odoo
      - -d
      - baa_odoo
      - -i
      - hr
      - --without-demo=all
      - --stop-after-init
      - --db_host=db
      - --db_user=odoo
      - --db_password=${BAA_ODOO_DB_PASSWORD:?set BAA_ODOO_DB_PASSWORD}

  odoo:
    image: odoo:18.0
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${BAA_ODOO_DB_PASSWORD:?set BAA_ODOO_DB_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - odoo-data:/var/lib/odoo
    command:
      - odoo
      - -d
      - baa_odoo
      - --db-filter=^baa_odoo$
      - --db_host=db
      - --db_user=odoo
      - --db_password=${BAA_ODOO_DB_PASSWORD:?set BAA_ODOO_DB_PASSWORD}
      - --http-port=8069
    ports:
      - "127.0.0.1:28069:8069"

volumes:
  odoo-data:
