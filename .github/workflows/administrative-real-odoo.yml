name: Real Odoo Offboarding Connector Acceptance

on:
  push:
    branches:
      - experiment/real-odoo-offboarding

permissions:
  contents: read

jobs:
  odoo-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          writer_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          verifier_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          for value in "$db_password" "$writer_password" "$verifier_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "BAA_ODOO_DB_PASSWORD=$db_password"
            echo "BAA_ODOO_WRITER_PASSWORD=$writer_password"
            echo "BAA_ODOO_VERIFIER_PASSWORD=$verifier_password"
            echo "BAA_ODOO_EVIDENCE_DIR=$RUNNER_TEMP/baa-real-odoo"
          } >> "$GITHUB_ENV"

      - name: Install AIOS
        run: python -m pip install --disable-pip-version-check -e .

      - name: Start real Odoo and PostgreSQL
        run: docker compose -f tests/acceptance/baa_offboarding/real_odoo/compose.yaml up -d

      - name: Run AIOS connectors against real Odoo
        run: |
          mkdir -p "$BAA_ODOO_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/real_odoo/run.py \
            --base-url http://127.0.0.1:28069 \
            --evidence-path "$BAA_ODOO_EVIDENCE_DIR/evidence.json"

      - name: Capture Odoo diagnostics
        if: always()
        run: |
          mkdir -p "$BAA_ODOO_EVIDENCE_DIR"
          docker compose -f tests/acceptance/baa_offboarding/real_odoo/compose.yaml ps > "$BAA_ODOO_EVIDENCE_DIR/compose-ps.txt" || true
          docker compose -f tests/acceptance/baa_offboarding/real_odoo/compose.yaml logs --no-color > "$BAA_ODOO_EVIDENCE_DIR/odoo.log" 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-odoo-offboarding-${{ github.run_id }}
          path: ${{ runner.temp }}/baa-real-odoo/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down Odoo
        if: always()
        run: docker compose -f tests/acceptance/baa_offboarding/real_odoo/compose.yaml down -v --remove-orphans
