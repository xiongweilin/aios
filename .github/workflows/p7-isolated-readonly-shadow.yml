name: P7 Isolated Read-Only Shadow

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Bounded read-only shadow duration in disposable infrastructure"
        type: choice
        required: true
        default: "5"
        options: ["1", "5", "15"]
  pull_request:
    paths:
      - ".github/workflows/p7-isolated-readonly-shadow.yml"
      - "tests/acceptance/baa_offboarding/real_e2e/p7_shadow_readonly.py"
      - "tests/acceptance/baa_offboarding/real_e2e/test_p7_shadow_readonly.py"
      - "tests/acceptance/baa_offboarding/real_e2e/p7_maintenance_triage.py"
      - "tests/acceptance/baa_offboarding/real_e2e/p7_maintenance_experiment.py"
      - "tests/acceptance/baa_offboarding/real_e2e/test_p7_maintenance_triage.py"
      - "tests/acceptance/baa_offboarding/real_e2e/p7_isolated_real_outage.py"
      - "tests/acceptance/baa_offboarding/real_e2e/test_p7_isolated_real_outage.py"
      - "tests/acceptance/baa_offboarding/P7-ISOLATED-REAL-OUTAGE.md"

permissions:
  contents: read

concurrency:
  group: p7-isolated-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-readonly-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: P7 offline read-only contract checks
        run: python -m unittest discover -s tests/acceptance/baa_offboarding/real_e2e -p "test_p7*.py" -v

      - name: Generate disposable test-only credentials
        shell: bash
        run: |
          set -euo pipefail
          make_secret() { python -c 'import secrets; print(secrets.token_urlsafe(32))'; }
          db="$(make_secret)"
          ow="$(make_secret)"
          ov="$(make_secret)"
          ka="$(make_secret)"
          kw="$(make_secret)"
          kv="$(make_secret)"
          ku="$(make_secret)"
          rt="$(make_secret)"
          for secret in "$db" "$ow" "$ov" "$ka" "$kw" "$kv" "$ku" "$rt"; do
            echo "::add-mask::$secret"
          done
          {
            echo "AIOS_IMAGE=aios:p7-shadow-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "BAA_REAL_ODOO_DB_PASSWORD=$db"
            echo "BAA_REAL_ODOO_WRITER_PASSWORD=$ow"
            echo "BAA_REAL_ODOO_VERIFIER_PASSWORD=$ov"
            echo "BAA_REAL_KEYCLOAK_ADMIN_PASSWORD=$ka"
            echo "BAA_REAL_KEYCLOAK_WRITER_SECRET=$kw"
            echo "BAA_REAL_KEYCLOAK_VERIFIER_SECRET=$kv"
            echo "BAA_REAL_KEYCLOAK_USER_PASSWORD=$ku"
            echo "BAA_REAL_RUNTIME_TOKEN=$rt"
            echo "BAA_REAL_FAULT_MODE=none"
            echo "BAA_REAL_ODOO_HOST_PORT=28169"
            echo "BAA_REAL_KEYCLOAK_HOST_PORT=28180"
            echo "BAA_REAL_RUNTIME_HOST_PORT=28186"
            echo "P7_EVIDENCE_DIR=$RUNNER_TEMP/p7-shadow"
          } >> "$GITHUB_ENV"

      - name: Build disposable AIOS image
        run: docker build --build-arg AIOS_APP_ROOT=/app -t "$AIOS_IMAGE" .

      - name: Start only isolated products with bounded fixture qualification
        shell: bash
        run: |
          set -euo pipefail
          compose=tests/acceptance/baa_offboarding/real_e2e/compose.yaml
          mkdir -p "$P7_EVIDENCE_DIR"
          attempted=0
          failed=0
          qualified=false
          for attempt in 1 2; do
            attempted="$attempt"
            if docker compose -f "$compose" up -d; then
              qualified=true
              break
            fi
            failed=$((failed + 1))
            echo "::warning title=Disposable fixture startup failed::Attempt $attempt of 2; no scientific episode has started"
            # Rebuild ONLY this runner's disposable test stack. A failed
            # Odoo bootstrap must never leave a partially initialized DB.
            docker compose -f "$compose" down -v --remove-orphans || true
            if (( attempt < 2 )); then sleep 3; fi
          done
          printf '{"schema":"p7-disposable-startup-v1","max_attempts":2,"attempted":%s,"failed":%s,"qualified":%s}\n' \
            "$attempted" "$failed" "$qualified" > "$P7_EVIDENCE_DIR/fixture-startup.json"
          if [[ "$qualified" != true ]]; then
            echo "::error title=Disposable fixture unavailable::Two bootstrap attempts failed; not a P7 recovery episode"
            exit 1
          fi

      - name: Qualify baseline health before fixed shadow window
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          urls = (
              f"http://127.0.0.1:{os.environ['BAA_REAL_RUNTIME_HOST_PORT']}/healthz",
              f"http://127.0.0.1:{os.environ['BAA_REAL_KEYCLOAK_HOST_PORT']}/realms/master",
              f"http://127.0.0.1:{os.environ['BAA_REAL_ODOO_HOST_PORT']}/",
          )
          for url in urls:
              deadline = time.monotonic() + 180
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except (TimeoutError, OSError):
                      pass
                  if time.monotonic() >= deadline:
                      raise RuntimeError("isolated shadow fixture did not qualify readiness")
                  time.sleep(2)
          PY

      - name: Run bounded GET-only P7 shadow window
        shell: bash
        run: |
          set -euo pipefail
          seconds=40
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.duration_minutes }}" in
              1) seconds=60 ;;
              5) seconds=300 ;;
              15) seconds=900 ;;
              *) echo "invalid shadow window"; exit 1 ;;
            esac
          fi
          mkdir -p "$P7_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/real_e2e/p7_shadow_readonly.py \
            --runtime-base "http://127.0.0.1:$BAA_REAL_RUNTIME_HOST_PORT" \
            --keycloak-base "http://127.0.0.1:$BAA_REAL_KEYCLOAK_HOST_PORT" \
            --odoo-base "http://127.0.0.1:$BAA_REAL_ODOO_HOST_PORT" \
            --duration-seconds "$seconds" \
            --interval-seconds 5 \
            --evidence-path "$P7_EVIDENCE_DIR/observations.json"

      - name: Qualify three frozen read-only maintenance triage cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P7_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/real_e2e/p7_maintenance_experiment.py \
            --runtime-base "http://127.0.0.1:$BAA_REAL_RUNTIME_HOST_PORT" \
            --keycloak-base "http://127.0.0.1:$BAA_REAL_KEYCLOAK_HOST_PORT" \
            --odoo-base "http://127.0.0.1:$BAA_REAL_ODOO_HOST_PORT" \
            --evidence-path "$P7_EVIDENCE_DIR/maintenance-triage.json"

      - name: Verify real, reversible Keycloak outage and conservative read-only recovery
        shell: bash
        env:
          P7_ALLOW_EPHEMERAL_KEYCLOAK_PAUSE: approved-ci-only
        run: |
          set -euo pipefail
          mkdir -p "$P7_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/real_e2e/p7_isolated_real_outage.py \
            --runtime-base "http://127.0.0.1:$BAA_REAL_RUNTIME_HOST_PORT" \
            --keycloak-base "http://127.0.0.1:$BAA_REAL_KEYCLOAK_HOST_PORT" \
            --odoo-base "http://127.0.0.1:$BAA_REAL_ODOO_HOST_PORT" \
            --evidence-path "$P7_EVIDENCE_DIR/real-isolated-outage.json"

      - name: Record versioned provenance
        if: always()
        shell: bash
        run: |
          mkdir -p "$P7_EVIDENCE_DIR"
          printf '{"AIOS_SHA":"%s","run_id":"%s","attempt":"%s","mode":"isolated-readonly-shadow"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$P7_EVIDENCE_DIR/provenance.json"
          docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml ps > "$P7_EVIDENCE_DIR/compose-ps.txt" || true

      - name: Upload bounded read-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p7-isolated-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p7-shadow/
          retention-days: 14
          if-no-files-found: warn

      - name: Destroy disposable products and persistent test volumes
        if: always()
        shell: bash
        run: |
          docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml down -v --remove-orphans || true
          if [[ -n "${AIOS_IMAGE:-}" ]]; then
            docker image rm -f "$AIOS_IMAGE" >/dev/null 2>&1 || true
          fi
