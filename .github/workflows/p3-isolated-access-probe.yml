name: P3 Isolated Protected Access Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p3-isolated-access-probe.yml"
      - "tests/acceptance/baa_offboarding/real_e2e/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p3-isolated-access-probe.yml"
      - "tests/acceptance/baa_offboarding/real_e2e/p3_*"

permissions:
  contents: read

concurrency:
  group: p3-isolated-access-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-resource-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout frozen BAA instrument
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xiongweilin/BAA-Protocol
          ref: 3ebd6e7b392d30063cd77d5015a3f2e288dfdb38
          path: baa-protocol
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare exclusively ephemeral test credentials
        shell: bash
        run: |
          set -euo pipefail
          make_secret() { python -c 'import secrets; print(secrets.token_urlsafe(32))'; }
          db_password="$(make_secret)"
          odoo_writer="$(make_secret)"
          odoo_verifier="$(make_secret)"
          keycloak_admin="$(make_secret)"
          keycloak_writer="$(make_secret)"
          keycloak_verifier="$(make_secret)"
          keycloak_user="$(make_secret)"
          runtime_token="$(make_secret)"
          for secret in "$db_password" "$odoo_writer" "$odoo_verifier" "$keycloak_admin" "$keycloak_writer" "$keycloak_verifier" "$keycloak_user" "$runtime_token"; do
            echo "::add-mask::$secret"
          done
          {
            echo "AIOS_IMAGE=aios:p3-isolated-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "BAA_REAL_ODOO_DB_PASSWORD=$db_password"
            echo "BAA_REAL_ODOO_WRITER_PASSWORD=$odoo_writer"
            echo "BAA_REAL_ODOO_VERIFIER_PASSWORD=$odoo_verifier"
            echo "BAA_REAL_KEYCLOAK_ADMIN_PASSWORD=$keycloak_admin"
            echo "BAA_REAL_KEYCLOAK_WRITER_SECRET=$keycloak_writer"
            echo "BAA_REAL_KEYCLOAK_VERIFIER_SECRET=$keycloak_verifier"
            echo "BAA_REAL_KEYCLOAK_USER_PASSWORD=$keycloak_user"
            echo "BAA_REAL_RUNTIME_TOKEN=$runtime_token"
            echo "BAA_REAL_FAULT_MODE=none"
            echo "BAA_REAL_ODOO_HOST_PORT=28169"
            echo "BAA_REAL_KEYCLOAK_HOST_PORT=28180"
            echo "BAA_REAL_RUNTIME_HOST_PORT=28186"
            echo "BAA_REAL_PROBE_HOST_PORT=28187"
            echo "P3_EVIDENCE_DIR=$RUNNER_TEMP/p3-isolated-access-probe"
          } >> "$GITHUB_ENV"

      - name: Run offline protected-resource tests
        env:
          P3_INTROSPECTION_CLIENT_ID: fixture
          P3_INTROSPECTION_CLIENT_SECRET: fixture-not-a-real-secret
        run: python -m unittest discover -s tests/acceptance/baa_offboarding/real_e2e -p "test_p3_*.py" -v

      - name: Install host AIOS
        run: python -m pip install --disable-pip-version-check -e .

      - name: Build disposable AIOS image
        run: docker build --build-arg AIOS_APP_ROOT=/app -t "$AIOS_IMAGE" .

      - name: Start isolated Odoo, Keycloak, World Runtime, and protected resource
        run: docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml --profile p3-probe up -d

      - name: Execute P3 real protected-resource point qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P3_EVIDENCE_DIR"
          export PYTHONPATH="$GITHUB_WORKSPACE/baa-protocol:$GITHUB_WORKSPACE/baa-protocol/integration"
          python tests/acceptance/baa_offboarding/real_e2e/p3_probe_real.py \
            --runtime-base "http://127.0.0.1:$BAA_REAL_RUNTIME_HOST_PORT" \
            --odoo-base "http://127.0.0.1:$BAA_REAL_ODOO_HOST_PORT" \
            --keycloak-base "http://127.0.0.1:$BAA_REAL_KEYCLOAK_HOST_PORT" \
            --probe-base "http://127.0.0.1:$BAA_REAL_PROBE_HOST_PORT" \
            --runtime-token "$BAA_REAL_RUNTIME_TOKEN" \
            --evidence-path "$P3_EVIDENCE_DIR/evidence.json"

      - name: Write pinned evidence provenance
        if: always()
        shell: bash
        run: |
          mkdir -p "$P3_EVIDENCE_DIR"
          printf '{"AIOS_SHA":"%s","BAA_SHA":"%s","run_id":"%s","run_attempt":"%s","evidence_grade":"isolated-point-probe-only"}\n' \
            "$GITHUB_SHA" "3ebd6e7b392d30063cd77d5015a3f2e288dfdb38" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$P3_EVIDENCE_DIR/provenance.json"

      - name: Capture bounded container diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$P3_EVIDENCE_DIR"
          docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml --profile p3-probe ps > "$P3_EVIDENCE_DIR/compose-ps.txt" || true
          docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml --profile p3-probe logs --no-color --tail 400 > "$P3_EVIDENCE_DIR/compose-tail.log" 2>&1 || true

      - name: Upload scoped P3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-isolated-access-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-isolated-access-probe/
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy isolated test products and volumes
        if: always()
        shell: bash
        run: |
          docker compose -f tests/acceptance/baa_offboarding/real_e2e/compose.yaml --profile p3-probe down -v --remove-orphans || true
          if [[ -n "${AIOS_IMAGE:-}" ]]; then
            docker image rm -f "$AIOS_IMAGE" >/dev/null 2>&1 || true
          fi
