name: BAA Proposal Function Interface Probe

on:
  push:
    branches:
      - experiment/baa-proposal-function-probe
    paths:
      - ".github/workflows/baa-proposal-function-probe.yml"
      - "tests/acceptance/baa_offboarding/probe_proposal_function_interface.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baa-proposal-function-probe-selfhosted
  cancel-in-progress: true

jobs:
  function-probe:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "baa-proposal-function-probe"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "BAA_FUNCTION_PROBE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_MODEL_ID=gpt-6-luna" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_GATEWAY_BASE=http://127.0.0.1:4101" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify local model gateway
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/health/liveliness" -TimeoutSec 5
          $catalog = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/v1/models" -TimeoutSec 10
          $ids = @($catalog.data | ForEach-Object { [string]$_.id } | Sort-Object -Unique)
          if ($ids -notcontains $env:BAA_MODEL_ID) {
            throw "required model is absent from local gateway catalog: $env:BAA_MODEL_ID"
          }
          $gatewayRepo = "D:\agent\llm-gateway"
          $gatewaySha = $null
          if (Test-Path -LiteralPath (Join-Path $gatewayRepo ".git")) {
            $gatewaySha = (& git -C $gatewayRepo rev-parse HEAD).Trim()
          }
          @{
            checked_at = (Get-Date).ToUniversalTime().ToString("o")
            model_id = $env:BAA_MODEL_ID
            gateway = $env:BAA_GATEWAY_BASE
            gateway_sha = $gatewaySha
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "$env:BAA_FUNCTION_PROBE_DIR/gateway.json"

      - name: Probe forced strict function call
        shell: pwsh
        run: |
          python tests/acceptance/baa_offboarding/probe_proposal_function_interface.py --gateway-base $env:BAA_GATEWAY_BASE --model $env:BAA_MODEL_ID --output "$env:BAA_FUNCTION_PROBE_DIR/probe.json" --timeout-seconds 90

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baa-proposal-function-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baa-proposal-function-probe/
          if-no-files-found: warn
          retention-days: 14
