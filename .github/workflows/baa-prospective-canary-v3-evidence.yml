name: BAA Prospective Canary Study v3 Evidence Recovery

on:
  push:
    branches:
      - experiment/baa-prospective-canary-v3-evidence
    paths:
      - ".github/workflows/baa-prospective-canary-v3-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baa-prospective-canary-v3-evidence-selfhosted
  cancel-in-progress: true

jobs:
  prospective-canary-v3-evidence:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120

    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout frozen BAA canary v3 study
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xiongweilin/BAA-Protocol
          ref: c9681ec6c1c54313f7e21467c4942e412b52583d
          path: baa-protocol
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "baa-prospective-canary-v3-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "BAA_MODEL_EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_MODEL_ID=gpt-6-luna" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_PROTOCOL_SHA=c9681ec6c1c54313f7e21467c4942e412b52583d" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_GATEWAY_BASE=http://127.0.0.1:4101" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure local model gateway
        shell: pwsh
        run: |
          $ready = $false
          try {
            $null = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/health/liveliness" -TimeoutSec 5
            $catalog = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/v1/models" -TimeoutSec 10
            $ids = @($catalog.data | ForEach-Object { [string]$_.id } | Sort-Object -Unique)
            if ($ids -contains $env:BAA_MODEL_ID) {
              $ready = $true
            }
          } catch {
            $ready = $false
          }

          if (-not $ready) {
            $gatewayRepo = "D:\agent\llm-gateway"
            $startScript = Join-Path $gatewayRepo "scripts\start-agent-gateway.ps1"
            if (-not (Test-Path -LiteralPath $startScript -PathType Leaf)) {
              throw "gateway recovery script is missing: $startScript"
            }
            & pwsh -NoProfile -NonInteractive -File $startScript
            if ($LASTEXITCODE -ne 0) {
              throw "gateway recovery failed with exit code $LASTEXITCODE"
            }
          }

      - name: Verify local model gateway
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/health/liveliness" -TimeoutSec 5
          $catalog = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/v1/models" -TimeoutSec 10
          $ids = @($catalog.data | ForEach-Object { [string]$_.id } | Sort-Object -Unique)
          if ($ids -notcontains $env:BAA_MODEL_ID) {
            throw "required model is absent from local gateway catalog: $env:BAA_MODEL_ID"
          }
          $gatewayRepo = "D:\agent\llm-gateway"
          $gatewaySha = $null
          if (Test-Path -LiteralPath (Join-Path $gatewayRepo ".git")) {
            $gatewaySha = (& git -C $gatewayRepo rev-parse HEAD).Trim()
          }
          if ($gatewaySha) {
            "BAA_GATEWAY_SHA=$gatewaySha" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          @{
            checked_at = (Get-Date).ToUniversalTime().ToString("o")
            gateway = $env:BAA_GATEWAY_BASE
            gateway_sha = $gatewaySha
            model_ids = $ids
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "$env:BAA_MODEL_EVIDENCE_DIR/gateway.json"

      - name: Verify frozen canary v3 fingerprint
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\baa-protocol"
          @'
          import copy
          import json
          from collections import Counter
          from pathlib import Path
          import sys

          sys.path.insert(0, "baa-protocol")

          from baa_protocol.delegation_frontier import DelegationBudget
          from baa_protocol.experiment import Regime
          from baa_protocol.prospective_canary_evidence_study import (
              EVIDENCE_POLICIES,
              HORIZONS,
              STALE_EVIDENCE_REASON,
              _observer_templates,
              _reacquire_current_stage_evidence,
              run_canary_evidence_study,
          )
          from baa_protocol.prospective_canary_feedback_study import (
              _adaptive_feedback_prompt,
          )
          from baa_protocol.prospective_canary_study import (
              CanarySimulator,
              canary_model_client,
              load_canary_workload,
          )

          path = Path("baa-protocol/experiments/prospective_canary_v1.json")
          raw = json.loads(path.read_text(encoding="utf-8"))
          assert raw["version"] == "prospective-canary-v1"
          assert len(raw["episodes"]) == 18
          assert Counter(ep["study_group"] for ep in raw["episodes"]) == {
              "clean_progression": 3,
              "evidence_maturation": 3,
              "guardrail_recovery": 3,
              "lost_ack_recovery": 3,
              "stale_route_refresh": 3,
              "irrecoverable_control": 3,
          }
          assert EVIDENCE_POLICIES == ("no_reacquire", "reacquire")
          assert HORIZONS == (4,)
          assert STALE_EVIDENCE_REASON == "stage evidence is stale or mismatched"

          client = canary_model_client()
          payload = client._request_payload("fingerprint")
          assert client.interface_mode == "function_tool"
          assert payload["tool_choice"] == {
              "type": "function",
              "name": "submit_canary_proposal",
          }
          assert payload["parallel_tool_calls"] is False
          assert payload["tools"][0]["strict"] is True

          _, episodes = load_canary_workload(path)
          target = next(
              ep for ep in episodes
              if ep.logical_name == "stale-route-refresh-b"
          )
          state_version = target.control_context["state_version"]

          assert _observer_templates(target, through_turn=0) == {}
          turn1 = _observer_templates(target, through_turn=1)
          assert (
              target.control_context["experiment_id"],
              0,
              10,
              state_version,
          ) in turn1
          assert (
              target.control_context["experiment_id"],
              2,
              100,
              state_version,
          ) in turn1
          assert (
              target.control_context["experiment_id"],
              1,
              50,
              state_version,
          ) not in turn1
          turn2 = _observer_templates(target, through_turn=2)
          assert (
              target.control_context["experiment_id"],
              1,
              50,
              state_version,
          ) in turn2

          simulator = CanarySimulator(
              target,
              Regime.BAA,
              DelegationBudget(min_useful_delivery=1),
          )
          # Initial public route is stale relative to realized route.
          assert (
              simulator.visible["current_stage_index"],
              simulator.visible["current_weight_percent"],
          ) != (
              simulator.context["current_stage_index"],
              simulator.context["current_weight_percent"],
          )
          assert not _reacquire_current_stage_evidence(
              target,
              simulator,
              through_turn=0,
          )

          simulator.apply_events(1)
          simulator.apply_events(2)
          hidden_before = copy.deepcopy(simulator.context)
          assert simulator.visible["stage_evidence"]["stage_index"] == 1
          assert _reacquire_current_stage_evidence(
              target,
              simulator,
              through_turn=2,
          )
          assert simulator.context == hidden_before
          assert simulator.visible["stage_evidence"]["stage_index"] == 0
          assert simulator.visible["stage_evidence"]["weight_percent"] == 10
          assert simulator.history[-1]["state_version"] == state_version
          assert simulator.history[-1]["observed_turn"] == 2

          prompt = _adaptive_feedback_prompt(
              target,
              simulator,
              feedback_policy="corrective",
          )
          for forbidden in (
              "no_reacquire",
              "reacquire",
              "bounded_action_protocol",
              "external_record_audit",
              "self_check",
          ):
              assert forbidden not in prompt

          class CountingWaitModel:
              model_id = "fingerprint-counting-wait"

              def __init__(self):
                  self.calls = 0

              def generate(
                  self,
                  prompt,
                  *,
                  episode_id,
                  capability_level,
                  phase,
                  regime,
              ):
                  self.calls += 1
                  return json.dumps({"actions": [{"kind": "wait"}]}), {}, 0.0

          counting = CountingWaitModel()
          clean = (
              next(
                  ep for ep in episodes
                  if ep.study_group == "clean_progression"
              ),
          )
          sharing_probe = run_canary_evidence_study(
              counting,
              clean,
          )
          assert counting.calls == 5
          assert sharing_probe["physical_sampling"]["calls"] == 5
          for policy in EVIDENCE_POLICIES:
              assert sharing_probe["cells"][policy]["logical_model_calls"] == 5

          print("prospective canary v3 fingerprint qualified")
          '@ | python -

      - name: Run prospective real-model canary evidence study v3
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\baa-protocol"
          python baa-protocol/scripts/run_prospective_canary_evidence_study.py --workload baa-protocol/experiments/prospective_canary_v1.json --gateway-base $env:BAA_GATEWAY_BASE --model $env:BAA_MODEL_ID --output "$env:BAA_MODEL_EVIDENCE_DIR/result.json" --timeout-seconds 180

      - name: Qualify model evidence
        shell: pwsh
        run: |
          $resultPath = "$env:BAA_MODEL_EVIDENCE_DIR/result.json"
          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "prospective canary v3 result.json is missing"
          }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json

          if ($result.study_version -ne "prospective-canary-v3-evidence-recovery") {
            throw "unexpected study version: $($result.study_version)"
          }
          if ($result.source_workload_version -ne "prospective-canary-v1") {
            throw "unexpected source workload: $($result.source_workload_version)"
          }
          if ($result.feedback_policy -ne "corrective") {
            throw "unexpected feedback policy: $($result.feedback_policy)"
          }
          if ($result.model_interface -ne "function_tool") {
            throw "unexpected model interface: $($result.model_interface)"
          }
          if (@($result.evidence_policies).Count -ne 2) {
            throw "expected two evidence policies"
          }
          if ($result.evidence_policies[0] -ne "no_reacquire" -or $result.evidence_policies[1] -ne "reacquire") {
            throw "unexpected evidence policy order"
          }
          if (@($result.horizons).Count -ne 1 -or [int]$result.horizons[0] -ne 4) {
            throw "expected exactly H4"
          }
          if ([int]$result.physical_sampling.calls -le 0) {
            throw "expected physical model calls"
          }
          foreach ($field in @("calls_with_errors", "transport_errors", "schema_errors", "model_errors")) {
            if ([int]$result.physical_sampling.$field -ne 0) {
              throw "$field invalidate the run: $($result.physical_sampling.$field)"
            }
          }

          foreach ($policy in @("no_reacquire", "reacquire")) {
            $cell = $result.cells.$policy
            if ([int]$cell.episodes -ne 18) {
              throw "incomplete denominator for $policy"
            }
            if ([int]$cell.stale_route.episodes -ne 3) {
              throw "incomplete stale-route denominator for $policy"
            }
            if ([int]$cell.non_stale.episodes -ne 15) {
              throw "incomplete non-stale denominator for $policy"
            }
          }
          if ([int]$result.cells.no_reacquire.evidence_reacquisitions -ne 0) {
            throw "no_reacquire unexpectedly performed evidence reacquisition"
          }

      - name: Extract compact summary
        if: always()
        shell: pwsh
        run: |
          $resultPath = "$env:BAA_MODEL_EVIDENCE_DIR/result.json"
          if (Test-Path -LiteralPath $resultPath) {
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            $summary = [ordered]@{
              study_version = $result.study_version
              source_workload_version = $result.source_workload_version
              model_id = $result.model_id
              model_interface = $result.model_interface
              baa_protocol_sha = $env:BAA_PROTOCOL_SHA
              aios_sha = $env:GITHUB_SHA
              gateway_sha = $env:BAA_GATEWAY_SHA
              budget = $result.budget
              feedback_policy = $result.feedback_policy
              evidence_policies = $result.evidence_policies
              horizons = $result.horizons
              physical_sampling = $result.physical_sampling
              cells = $result.cells
            }
            $summary | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 "$env:BAA_MODEL_EVIDENCE_DIR/summary.json"
          }

      - name: Upload prospective canary v3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baa-prospective-canary-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baa-prospective-canary-v3-evidence/
          if-no-files-found: warn
          retention-days: 14
