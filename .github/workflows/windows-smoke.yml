name: Windows Docker Desktop Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "Dockerfile"
      - "compose.yaml"
      - "migrations/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/acceptance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aios-windows-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-desktop:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install acceptance target test dependencies
        working-directory: tests/acceptance/autonomous_development/target
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-test.txt
      - name: Run acceptance target unit tests
        working-directory: tests/acceptance/autonomous_development/target
        run: python -m pytest -q tests
      - name: Run isolated Docker Desktop smoke lifecycle
        shell: pwsh
        run: >-
          python tests/acceptance/autonomous_development/run_acceptance.py
          --evidence-path "$env:RUNNER_TEMP\aios-acceptance\evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aios-acceptance/
          if-no-files-found: warn
          retention-days: 14
