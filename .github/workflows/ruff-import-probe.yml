name: Ruff Import Probe

on:
  pull_request:
    paths:
      - ".github/workflows/ruff-import-probe.yml"
      - "tests/acceptance/baa_offboarding/real_e2e/run.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Show canonical import diff
        shell: bash
        run: |
          set -euo pipefail
          ruff check --select I --fix tests/acceptance/baa_offboarding/real_e2e/run.py
          git diff -- tests/acceptance/baa_offboarding/real_e2e/run.py
          if ! git diff --quiet -- tests/acceptance/baa_offboarding/real_e2e/run.py; then
            exit 1
          fi
