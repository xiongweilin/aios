name: Export refactor source

on:
  pull_request:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply staged simplification
        run: |
          python scripts/refactor_postgres_records.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domains/autonomous_development/adapters/postgres
          git commit -m "refactor: collapse postgres record boilerplate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-source
          path: |
            .
            !.git
          include-hidden-files: true
