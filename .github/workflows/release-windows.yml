name: Windows AIOS Setup release

on:
  push:
    tags:
      - 'aios-v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require a verified compatibility profile
        shell: pwsh
        run: |
          $readinessPath = 'profiles/release-readiness.json'
          if (-not (Test-Path -LiteralPath $readinessPath)) {
            throw 'No release-readiness evidence exists; refusing to publish Setup.'
          }
          $readiness = Get-Content -LiteralPath $readinessPath -Raw | ConvertFrom-Json
          if ($readiness.schemaVersion -ne 1 -or $readiness.ready -ne $true) {
            throw "AIOS Setup release is gated: $($readiness.reason)"
          }
          $profilePath = 'profiles/stable.json'
          if (-not (Test-Path -LiteralPath $profilePath)) {
            throw 'No stable compatibility profile exists; refusing to publish a non-functional Setup.'
          }
          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if ($profile.schemaVersion -ne 1 -or $profile.validation.status -ne 'passed' -or @($profile.components).Count -eq 0) {
            throw 'The stable profile is incomplete or has not passed compatibility validation.'
          }
          go run ./cmd/verify-profile $profilePath
          if ($LASTEXITCODE -ne 0) { throw 'The stable profile failed strict validation.' }
      - name: Build Manager and Setup
        shell: pwsh
        run: ./build.ps1
      - name: Publish the single user-facing installer
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AIOS-Setup.exe
          fail_on_unmatched_files: true
