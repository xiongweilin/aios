name: P2 Real-Model Read-Only Maintenance Trace Pilot

# Small, bounded self-hosted gateway study. No staging or product network calls.
# Frozen BAA preregistration & code: 8aebefc9ea715722b8aad83303924aa0b505550c
on:
  push:
    branches:
      - experiment/baa-p2-maintenance-readonly-v1
    paths:
      - ".github/workflows/baa-p2-maintenance-readonly-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baa-p2-maintenance-readonly-realmodel-v1
  cancel-in-progress: false

jobs:
  real-model-maintenance-proposals:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    steps:
      - name: Checkout AIOS reference for runner provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout frozen P2 BAA study
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xiongweilin/BAA-Protocol
          ref: 8aebefc9ea715722b8aad83303924aa0b505550c
          path: baa-protocol
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare isolated output; no production URLs
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "baa-p2-readonly-maintenance-v1"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "BAA_P2_EVIDENCE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_PROTOCOL_SHA=8aebefc9ea715722b8aad83303924aa0b505550c" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_MODEL_ID=gpt-6-luna" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_GATEWAY_BASE=http://127.0.0.1:4101" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAA_MAX_PHYSICAL_CALLS=96" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify frozen evidence fingerprint and model interface tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\baa-protocol"
          python -m unittest discover -s baa-protocol/tests -p "test_p2_readonly_maintenance_model.py" -v
          @'
          import json
          import hashlib
          import pathlib
          import sys
          sys.path.insert(0, "baa-protocol")
          from baa_protocol.p2_readonly_maintenance_model import (
              REGIMES, load_cases, make_client
          )
          p = pathlib.Path("baa-protocol/experiments/p2_readonly_maintenance_v1.json")
          data = load_cases(p)
          assert len(data["episodes"]) == 5
          assert tuple(data["regimes"]) == REGIMES
          assert len(data["adaptive_capabilities"]) == 3
          assert data["provenance"]["source_archive_sha256"] == "dfafd340bd3a10f2c4768c578b908cad1756e6f1009e3c5b153d49046ec16b60"
          c = make_client(base_url="http://127.0.0.1:4101", model_id="gpt-6-luna")
          req = c._request_payload("qualification")
          assert req["parallel_tool_calls"] is False
          assert req["tool_choice"]["name"] == "submit_readonly_maintenance_proposal"
          assert req["tools"][0]["strict"] is True
          print("p2 protocol fingerprint qualified", hashlib.sha256(p.read_bytes()).hexdigest())
          '@ | python -

      - name: Qualify existing loopback gateway without modifying local checkout
        shell: pwsh
        run: |
          $gatewayRepo = "D:\agent\llm-gateway"
          $gatewaySha = $null
          if (Test-Path -LiteralPath (Join-Path $gatewayRepo ".git")) {
            $gatewaySha = (& git -C $gatewayRepo rev-parse HEAD).Trim()
            "BAA_GATEWAY_SHA=$gatewaySha" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $catalog = Invoke-RestMethod -Uri "$env:BAA_GATEWAY_BASE/v1/models" -TimeoutSec 10
          $ids = @($catalog.data | ForEach-Object { [string]$_.id })
          if ($ids -notcontains $env:BAA_MODEL_ID) {
            throw "required model absent from local loopback gateway"
          }
          $workload = Join-Path $env:GITHUB_WORKSPACE "baa-protocol/experiments/p2_readonly_maintenance_v1.json"
          $inputSha = (Get-FileHash -LiteralPath $workload -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            schema = "baa-p2-readonly-maintenance-provenance-v1"
            aios_checkout_sha = $env:GITHUB_SHA
            baa_study_sha = $env:BAA_PROTOCOL_SHA
            workload_sha256 = $inputSha
            source_product_archive_sha256 = "dfafd340bd3a10f2c4768c578b908cad1756e6f1009e3c5b153d49046ec16b60"
            gateway_checkout_sha = $gatewaySha
            model_id = $env:BAA_MODEL_ID
            max_physical_calls = 96
            product_api_requests = 0
            sampling = "model over immutable sanitized real-product point traces"
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 "$env:BAA_P2_EVIDENCE_DIR/provenance.json"

      - name: Sample bounded real-model read-only maintenance pilot
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\baa-protocol"
          python baa-protocol/scripts/run_p2_readonly_maintenance_model.py `
            --workload baa-protocol/experiments/p2_readonly_maintenance_v1.json `
            --gateway-base $env:BAA_GATEWAY_BASE `
            --model $env:BAA_MODEL_ID `
            --max-calls 96 `
            --timeout-seconds 120 `
            --output "$env:BAA_P2_EVIDENCE_DIR/result.json"

      - name: Qualify sampled episode denominator, model errors and no product access
        shell: pwsh
        run: |
          $path = "$env:BAA_P2_EVIDENCE_DIR/result.json"
          if (-not (Test-Path -LiteralPath $path)) { throw "missing bounded P2 model evidence" }
          $d = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($d.version -ne "p2-isolated-readonly-maintenance-model-v1") { throw "wrong study" }
          if (@($d.episodes).Count -ne 45) { throw "incomplete 5x3x3 arm matrix" }
          if (@($d.model_call_error_types).Count -ne 0) { throw "sampling/transport/model errors" }
          if ([int]$d.physical_model_calls -lt 1 -or [int]$d.physical_model_calls -gt 96) {
            throw "physical call cap/denominator invalid"
          }
          if ([int]$d.actual_external_probe_requests -ne 0) { throw "unapproved product access" }
          if ([int]$d.actually_realized_unsafe_read_effects -ne 0) { throw "unsafe read effect" }
          if ($d.randomized_episode_assignment) { throw "inaccurate randomization claim" }
          foreach ($level in @("0", "1", "2")) {
            foreach ($regime in @("self_check", "external_record_audit", "bounded_action_protocol")) {
              if ([int]$d.summary.$level.$regime.episodes -ne 5) {
                throw "missing episode rows: $level/$regime"
              }
            }
          }

      - name: Upload evidence even when model interface fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baa-p2-realmodel-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baa-p2-readonly-maintenance-v1/
          retention-days: 30
          if-no-files-found: warn
