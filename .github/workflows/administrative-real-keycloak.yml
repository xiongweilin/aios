name: Real Keycloak Offboarding Connector Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/administrative-real-keycloak.yml"
      - "src/domains/administrative_orchestrator/integrations/keycloak_effects.py"
      - "src/domains/administrative_orchestrator/integrations/credentials.py"
      - "src/domains/administrative_orchestrator/integrations/effect_common.py"
      - "tests/acceptance/baa_offboarding/real_keycloak/**"
  pull_request:
    paths:
      - ".github/workflows/administrative-real-keycloak.yml"
      - "src/domains/administrative_orchestrator/integrations/keycloak_effects.py"
      - "src/domains/administrative_orchestrator/integrations/credentials.py"
      - "src/domains/administrative_orchestrator/integrations/effect_common.py"
      - "tests/acceptance/baa_offboarding/real_keycloak/**"

permissions:
  contents: read

jobs:
  keycloak-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          admin_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          writer_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          verifier_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          user_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          for value in "$admin_secret" "$writer_secret" "$verifier_secret" "$user_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$admin_secret"
            echo "BAA_KEYCLOAK_WRITER_SECRET=$writer_secret"
            echo "BAA_KEYCLOAK_VERIFIER_SECRET=$verifier_secret"
            echo "BAA_KEYCLOAK_USER_PASSWORD=$user_password"
            echo "BAA_KEYCLOAK_EVIDENCE_DIR=$RUNNER_TEMP/baa-real-keycloak"
          } >> "$GITHUB_ENV"

      - name: Install AIOS
        run: python -m pip install --disable-pip-version-check -e .

      - name: Start real Keycloak
        run: docker compose -f tests/acceptance/baa_offboarding/real_keycloak/compose.yaml up -d

      - name: Run AIOS connectors against real Keycloak
        run: |
          mkdir -p "$BAA_KEYCLOAK_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/real_keycloak/run.py \
            --base-url http://127.0.0.1:28080 \
            --evidence-path "$BAA_KEYCLOAK_EVIDENCE_DIR/evidence.json"

      - name: Capture Keycloak diagnostics
        if: always()
        run: |
          mkdir -p "$BAA_KEYCLOAK_EVIDENCE_DIR"
          docker compose -f tests/acceptance/baa_offboarding/real_keycloak/compose.yaml ps > "$BAA_KEYCLOAK_EVIDENCE_DIR/compose-ps.txt" || true
          docker compose -f tests/acceptance/baa_offboarding/real_keycloak/compose.yaml logs --no-color > "$BAA_KEYCLOAK_EVIDENCE_DIR/keycloak.log" 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-keycloak-offboarding-${{ github.run_id }}
          path: ${{ runner.temp }}/baa-real-keycloak/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down Keycloak
        if: always()
        run: docker compose -f tests/acceptance/baa_offboarding/real_keycloak/compose.yaml down -v --remove-orphans
