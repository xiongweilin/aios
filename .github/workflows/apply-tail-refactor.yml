name: Apply tail refactor

on:
  push:
    branches:
      - refactor/reduce-complexity-tail

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reduce-complexity-tail
          fetch-depth: 0
          persist-credentials: true
      - name: Apply staged tail refactor
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.refactor-patches/*.patch.txt)
          if [ ${#parts[@]} -eq 0 ]; then
            exit 0
          fi
          cat "${parts[@]}" > /tmp/tail-refactor.patch
          git apply --check --whitespace=error /tmp/tail-refactor.patch
          git apply --whitespace=error /tmp/tail-refactor.patch
          rm -rf .refactor-patches
          rm -f .github/workflows/export-refactor.yml
          rm -f .github/workflows/apply-tail-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: complete tail complexity reduction"
          git push origin HEAD:refactor/reduce-complexity-tail
