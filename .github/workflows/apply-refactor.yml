name: Apply refactor payload

on:
  push:
    branches:
      - refactor/reduce-complexity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reduce-complexity
          fetch-depth: 0
          persist-credentials: true
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .refactor-payload.tar.gz || exit 0
          tar -xzf .refactor-payload.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -rf -- "$path"
          done < .refactor-deletions.txt
          rm -f .refactor-payload.tar.gz .refactor-deletions.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: remove duplicate and unreachable runtime layers"
          git push origin HEAD:refactor/reduce-complexity
