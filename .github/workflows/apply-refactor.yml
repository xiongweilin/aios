name: Apply refactor payload

on:
  push:
    branches:
      - refactor/reduce-complexity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reduce-complexity
          fetch-depth: 0
          persist-credentials: true
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.refactor-payload.parts/*.b64)
          [ "${#parts[@]}" -gt 0 ] || exit 0
          cat "${parts[@]}" | base64 -d > /tmp/refactor-payload.tar.gz
          gzip -t /tmp/refactor-payload.tar.gz
          tar -xzf /tmp/refactor-payload.tar.gz
          while IFS= read -r path; do
            [ -z "$path" ] || rm -rf -- "$path"
          done < .refactor-deletions.txt
          rm -rf .refactor-payload.parts
          rm -f .refactor-payload.part.* .refactor-payload.tar.gz .refactor-deletions.txt
          rm -f .github/workflows/apply-refactor.yml .github/workflows/export-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: remove duplicate and unreachable runtime layers"
          git push origin HEAD:refactor/reduce-complexity
