name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: aios-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aios_test
          POSTGRES_USER: aios_test
          # Ephemeral CI-only database on the private job service network.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios_test -d aios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cp .env.example .env
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Structure
        run: python scripts/check_structure.py
      - name: Compose
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build personal-world
      - name: Container import smoke
        run: >-
          docker compose run --rm --no-deps personal-world python -c
          "import aios, semantic_language, personal_world, world_runtime, control_plane, administrative_orchestrator, autonomous_development"
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: ruff check src tests
      - name: Mypy core
        run: mypy src/semantic/semantic_language src/kernel/world_runtime
      - name: Import boundaries
        run: lint-imports
      - name: Semantic acceptance
        run: >-
          pytest -q
          tests/kernel/world_runtime/test_refactor_architecture.py
          tests/kernel/world_runtime/test_continuous_qualification.py
          tests/kernel/world_runtime/test_contract_catalog.py
          tests/kernel/world_runtime/test_conformance.py
      - name: Conformance vector traceability
        run: pytest -q tests/conformance_vectors
      - name: Tests
        run: pytest -m "not postgres and not integration" --ignore=tests/acceptance
      - name: PostgreSQL conformance
        env:
          WORLD_RUNTIME_TEST_POSTGRES_DSN: postgresql://aios_test@127.0.0.1:5432/aios_test
          PERSONAL_WORLD_TEST_POSTGRES_URL: postgresql+psycopg://aios_test@127.0.0.1:5432/aios_test
        run: >-
          pytest -q -m postgres
          tests/kernel/personal_world/test_postgres.py
          tests/kernel/world_runtime/test_postgres_ledger.py


  baa-network-preflight-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pinned
            baa_ref: 2a504ec120034288323adc5774372e4d0e8c4f48
          - label: current-baa-main
            baa_ref: main
    steps:
      - name: Checkout AIOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout BAA-Protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xiongweilin/BAA-Protocol
          ref: ${{ matrix.baa_ref }}
          path: baa-protocol
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record exact cross-repository heads
        run: |
          git rev-parse HEAD
          git -C baa-protocol rev-parse HEAD
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          token="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$token"
          {
            echo "AIOS_IMAGE=aios:baa-network-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "BAA_RUNTIME_HOST_PORT=28086"
            echo "BAA_SANDBOX_HOST_PORT=28090"
            echo "BAA_NETWORK_RUNTIME_TOKEN=$token"
            echo "BAA_EVIDENCE_DIR=$RUNNER_TEMP/baa-offboarding-network"
          } >> "$GITHUB_ENV"
      - name: Install host AIOS
        run: python -m pip install --disable-pip-version-check -e .
      - name: Build isolated image
        run: docker build --build-arg AIOS_APP_ROOT=/app -t "$AIOS_IMAGE" .
      - name: Start network stack
        run: docker compose -f tests/acceptance/baa_offboarding/compose.network.yaml up -d
      - name: Run network experiment
        env:
          PYTHONPATH: ${{ github.workspace }}/baa-protocol:${{ github.workspace }}/baa-protocol/integration
        run: |
          mkdir -p "$BAA_EVIDENCE_DIR"
          python tests/acceptance/baa_offboarding/run_network_experiment.py             --runtime-base "http://127.0.0.1:$BAA_RUNTIME_HOST_PORT"             --sandbox-base "http://127.0.0.1:$BAA_SANDBOX_HOST_PORT"             --runtime-token "$BAA_NETWORK_RUNTIME_TOKEN"             --evidence-path "$BAA_EVIDENCE_DIR/evidence.json"
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p "$BAA_EVIDENCE_DIR"
          docker compose -f tests/acceptance/baa_offboarding/compose.network.yaml ps > "$BAA_EVIDENCE_DIR/compose-ps.txt" || true
          docker compose -f tests/acceptance/baa_offboarding/compose.network.yaml logs --no-color > "$BAA_EVIDENCE_DIR/compose.log" 2>&1 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baa-offboarding-network-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baa-offboarding-network/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown
        if: always()
        run: |
          docker compose -f tests/acceptance/baa_offboarding/compose.network.yaml down -v --remove-orphans || true
          docker image rm -f "$AIOS_IMAGE" 2>/dev/null || true

  # Keep the stable branch-protection context, covering both pinned and moving BAA.
  baa-network-preflight:
    needs: baa-network-preflight-versions
    runs-on: ubuntu-latest
    steps:
      - name: Both BAA contract baselines passed
        run: echo "Pinned and current-BAA network preflights succeeded"
