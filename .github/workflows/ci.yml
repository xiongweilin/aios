name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cp .env.example .env
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Structure
        run: python scripts/check_structure.py
      - name: Compose
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build personal-world
      - name: Container import smoke
        run: >-
          docker compose run --rm --no-deps personal-world python -c
          "import aios, semantic_language, personal_world, world_runtime, control_plane, administrative_orchestrator, autonomous_development"
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -m "not postgres and not integration" --ignore=tests/acceptance
