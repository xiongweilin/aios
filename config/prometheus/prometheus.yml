global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: autonomous-development
    metrics_path: /metrics
    static_configs:
      - targets: ["autonomous-development:8765"]

  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:18083"]
