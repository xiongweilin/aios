# gitleaks 配置：只加入经过逐条核验的窄范围豁免，不放宽规则本身。
# 历史命中 32 处，全部核对为：
#   1) staging 示例与占位配置：值是小写词加连字符的描述性占位（m6–m9 ...-secret / ...-client-id），
#      与同目录 .env.example 的同名占位一致，无随机性（无大写、数字<=1、unique≈长度/2）；
#   2) 已删除的 sonar 诊断 workflow：curl --user "$SONAR_TOKEN:" 的变量引用，不含字面凭据。
# 真实随机凭据不会命中这些模式，因此豁免范围之外的命中仍会让门禁失败。
[extend]
useDefault = true

[allowlist]
description = "documented staging placeholders and shell variable references"
regexTarget = "line"
regexes = [
  '''ADMIN_KEYCLOAK_VERIFIER_[A-Z_]+=m[6-9][a-z0-9-]*''',
  '''"secret"\s*:\s*"m[6-9][a-z0-9-]*"''',
  '''(-u|--user)\s+"\$\{?SONAR_TOKEN\}?:?"''',
  '''"[A-Za-z0-9_]+"\s*:\s*"client-secret"''',
]
