name: administrative-orchestrator

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-administrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-administrative}
      POSTGRES_DB: ${POSTGRES_DB:-administrative}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - administrative-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-administrative} -d ${POSTGRES_DB:-administrative}"]
      interval: 5s
      timeout: 5s
      retries: 12

  sandbox-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SANDBOX_POSTGRES_USER:-administrative_sandbox}
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD:-administrative_sandbox}
      POSTGRES_DB: ${SANDBOX_POSTGRES_DB:-administrative_sandbox}
    ports:
      - "127.0.0.1:${SANDBOX_POSTGRES_PORT:-5433}:5432"
    volumes:
      - administrative-sandbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_POSTGRES_USER:-administrative_sandbox} -d ${SANDBOX_POSTGRES_DB:-administrative_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    image: administrative-orchestrator:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy

  foundation-bootstrap:
    build: .
    image: administrative-orchestrator:local
    restart: "no"
    command: ["python", "-m", "administrative_orchestrator.bootstrap_foundation"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_AUTO_CREATE_SCHEMA: "false"
      ADMIN_BOOTSTRAP_AUTHORITY_JSON: >-
        {"principals":[{"principal_id":"person:e2e-requester","display_name":"E2E Requester"},{"principal_id":"person:e2e-hr-approver","display_name":"E2E HR Approver"},{"principal_id":"person:e2e-manager-approver","display_name":"E2E Manager Approver"},{"principal_id":"person:e2e-access-approver","display_name":"E2E Access Approver"},{"principal_id":"person:e2e-hr-operator","display_name":"E2E HR Operator"},{"principal_id":"person:e2e-auditor","display_name":"E2E Auditor"},{"principal_id":"person:e2e-platform-operator","display_name":"E2E Platform Operator"}],"role_assignments":[{"principal_id":"person:e2e-hr-approver","role":"hr_approver","organization_scope":"*"},{"principal_id":"person:e2e-manager-approver","role":"manager","organization_scope":"*"},{"principal_id":"person:e2e-access-approver","role":"access_approver","organization_scope":"*"},{"principal_id":"person:e2e-hr-operator","role":"hr_operator","organization_scope":"*"},{"principal_id":"person:e2e-auditor","role":"administrative_auditor","organization_scope":"*"},{"principal_id":"person:e2e-platform-operator","role":"platform_operator","organization_scope":"*"}]}
    depends_on:
      migrate:
        condition: service_completed_successfully

  sandbox:
    build: .
    image: administrative-orchestrator:local
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "administrative_orchestrator.sandbox:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      ADMIN_SANDBOX_DATABASE_URL: postgresql+psycopg://${SANDBOX_POSTGRES_USER:-administrative_sandbox}:${SANDBOX_POSTGRES_PASSWORD:-administrative_sandbox}@sandbox-postgres:5432/${SANDBOX_POSTGRES_DB:-administrative_sandbox}
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8010}:8010"
    depends_on:
      sandbox-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    image: administrative-orchestrator:local
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "administrative_orchestrator.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_AUTO_CREATE_SCHEMA: "false"
      ADMIN_RUNTIME_PROFILE: "governed"
      ADMIN_AUTH_MODE: "development"
      ADMIN_EXTERNAL_EFFECTS_ENABLED: "true"
      ADMIN_SANDBOX_BASE_URL: http://sandbox:8010
      ADMIN_FEISHU_BASE_URL: ${ADMIN_FEISHU_BASE_URL:-https://open.feishu.cn}
      ADMIN_FEISHU_VERIFICATION_TOKEN: ${ADMIN_FEISHU_VERIFICATION_TOKEN:-}
      ADMIN_FEISHU_ENCRYPT_KEY: ${ADMIN_FEISHU_ENCRYPT_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: .
    image: administrative-orchestrator:local
    restart: unless-stopped
    command: ["python", "-m", "administrative_orchestrator.worker"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_WORKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-administrative}:${POSTGRES_PASSWORD:-administrative}@postgres:5432/administrative_dbos
      ADMIN_AUTO_CREATE_SCHEMA: "false"
      ADMIN_RUNTIME_PROFILE: "governed"
      ADMIN_EXTERNAL_EFFECTS_ENABLED: "true"
      ADMIN_SANDBOX_BASE_URL: http://sandbox:8010
      ADMIN_WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-0.25}
      ADMIN_FEISHU_BASE_URL: ${ADMIN_FEISHU_BASE_URL:-https://open.feishu.cn}
      ADMIN_FEISHU_APP_ID: ${ADMIN_FEISHU_APP_ID:-}
      ADMIN_FEISHU_APP_SECRET: ${ADMIN_FEISHU_APP_SECRET:-}
      ADMIN_FEISHU_ACCESS_TOKEN: ${ADMIN_FEISHU_ACCESS_TOKEN:-}
      ADMIN_FEISHU_ARTIFACT_ROOT: /var/lib/administrative/intake-artifacts
      ADMIN_INTAKE_MODEL_URL: ${ADMIN_INTAKE_MODEL_URL:-}
      ADMIN_INTAKE_MODEL_API_KEY: ${ADMIN_INTAKE_MODEL_API_KEY:-}
      ADMIN_INTAKE_MODEL_PROTOCOL: ${ADMIN_INTAKE_MODEL_PROTOCOL:-json}
      ADMIN_INTAKE_MODEL_NAME: ${ADMIN_INTAKE_MODEL_NAME:-}
      ADMIN_INTAKE_MODEL_MAX_TOKENS: ${ADMIN_INTAKE_MODEL_MAX_TOKENS:-2400}
      ADMIN_INVESTIGATION_CLIENT_URL: ${ADMIN_INVESTIGATION_CLIENT_URL:-}
      ADMIN_INVESTIGATION_CLIENT_API_KEY: ${ADMIN_INVESTIGATION_CLIENT_API_KEY:-}
      ADMIN_INVESTIGATION_CLIENT_API_KEY_FILE: ${ADMIN_INVESTIGATION_CLIENT_API_KEY_FILE:-}
      ADMIN_INVESTIGATION_MODEL_URL: ${ADMIN_INVESTIGATION_MODEL_URL:-}
      ADMIN_INVESTIGATION_MODEL_API_KEY: ${ADMIN_INVESTIGATION_MODEL_API_KEY:-}
      ADMIN_INVESTIGATION_MODEL_API_KEY_FILE: ${ADMIN_INVESTIGATION_MODEL_API_KEY_FILE:-}
      ADMIN_INVESTIGATION_MODEL_PROTOCOL: ${ADMIN_INVESTIGATION_MODEL_PROTOCOL:-openai-chat}
      ADMIN_INVESTIGATION_MODEL_NAME: ${ADMIN_INVESTIGATION_MODEL_NAME:-}
      ADMIN_INVESTIGATION_MODEL_MAX_TOKENS: ${ADMIN_INVESTIGATION_MODEL_MAX_TOKENS:-2000}
      ADMIN_INVESTIGATION_MODEL_PROVIDER: ${ADMIN_INVESTIGATION_MODEL_PROVIDER:-configured-model-gateway}
      ADMIN_INVESTIGATION_MODEL_VERSION: ${ADMIN_INVESTIGATION_MODEL_VERSION:-configured}
      ADMIN_INVESTIGATION_MODEL_PROMPT_REF: ${ADMIN_INVESTIGATION_MODEL_PROMPT_REF:-adaptive-investigation-v1}
    volumes:
      - administrative-intake-artifacts:/var/lib/administrative/intake-artifacts
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy

volumes:
  administrative-pgdata:
  administrative-sandbox-pgdata:
  administrative-intake-artifacts:
