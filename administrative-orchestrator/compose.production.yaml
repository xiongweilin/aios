name: administrative-orchestrator-production

x-admin-common: &admin-common
  image: administrative-orchestrator:production
  restart: unless-stopped
  environment: &admin-environment
    ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-administrative}
    ADMIN_AUTO_CREATE_SCHEMA: "false"
    ADMIN_RUNTIME_PROFILE: production
    ADMIN_AUTH_MODE: oidc
    ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:?set ADMIN_OIDC_ISSUER}
    ADMIN_OIDC_AUDIENCE: ${ADMIN_OIDC_AUDIENCE:?set ADMIN_OIDC_AUDIENCE}
    ADMIN_OIDC_ALLOWED_ALGORITHMS: RS256,ES256
    ADMIN_AUTHORITY_ENFORCEMENT_ENABLED: "true"
    ADMIN_EXTERNAL_EFFECTS_ENABLED: "true"
    ADMIN_WORLD_RUNTIME_MODE: cutover
    ADMIN_WORLD_RUNTIME_BASE_URL: http://world-runtime:8020
    ADMIN_HRIS_SOURCE_KIND: odoo
    ADMIN_ODOO_BASE_URL: ${ADMIN_ODOO_BASE_URL:?set ADMIN_ODOO_BASE_URL}
    ADMIN_ODOO_DATABASE: ${ADMIN_ODOO_DATABASE:?set ADMIN_ODOO_DATABASE}
    ADMIN_ODOO_READER_USERNAME: ${ADMIN_ODOO_READER_USERNAME:?set ADMIN_ODOO_READER_USERNAME}
    ADMIN_ODOO_READER_SECRET: ${ADMIN_ODOO_READER_SECRET:?inject ADMIN_ODOO_READER_SECRET}
    ADMIN_IAM_SOURCE_KIND: keycloak
    ADMIN_KEYCLOAK_BASE_URL: ${ADMIN_KEYCLOAK_BASE_URL:?set ADMIN_KEYCLOAK_BASE_URL}
    ADMIN_KEYCLOAK_REALM: ${ADMIN_KEYCLOAK_REALM:?set ADMIN_KEYCLOAK_REALM}
    ADMIN_KEYCLOAK_READER_CLIENT_ID: ${ADMIN_KEYCLOAK_READER_CLIENT_ID:?set ADMIN_KEYCLOAK_READER_CLIENT_ID}
    ADMIN_KEYCLOAK_READER_SECRET: ${ADMIN_KEYCLOAK_READER_SECRET:?inject ADMIN_KEYCLOAK_READER_SECRET}
    ADMIN_AUTHORITATIVE_FACT_MAX_AGE_SECONDS: ${ADMIN_AUTHORITATIVE_FACT_MAX_AGE_SECONDS:-300}
    ADMIN_CONNECTOR_TIMEOUT_SECONDS: ${ADMIN_CONNECTOR_TIMEOUT_SECONDS:-10}
    # Optional Feishu provider boundary. Empty credentials keep intake disabled;
    # the API and worker fail closed until the operator configures it.
    ADMIN_FEISHU_BASE_URL: ${ADMIN_FEISHU_BASE_URL:-https://open.feishu.cn}
    ADMIN_FEISHU_VERIFICATION_TOKEN: ${ADMIN_FEISHU_VERIFICATION_TOKEN:-}
    ADMIN_FEISHU_ENCRYPT_KEY: ${ADMIN_FEISHU_ENCRYPT_KEY:-}
    ADMIN_INVESTIGATION_CLIENT_URL: ${ADMIN_INVESTIGATION_CLIENT_URL:-}
    ADMIN_INVESTIGATION_CLIENT_API_KEY: ${ADMIN_INVESTIGATION_CLIENT_API_KEY:-}
    ADMIN_INVESTIGATION_CLIENT_API_KEY_FILE: ${ADMIN_INVESTIGATION_CLIENT_API_KEY_FILE:-}
    ADMIN_INVESTIGATION_MODEL_URL: ${ADMIN_INVESTIGATION_MODEL_URL:-}
    ADMIN_INVESTIGATION_MODEL_API_KEY: ${ADMIN_INVESTIGATION_MODEL_API_KEY:-}
    ADMIN_INVESTIGATION_MODEL_API_KEY_FILE: ${ADMIN_INVESTIGATION_MODEL_API_KEY_FILE:-}
    ADMIN_INVESTIGATION_MODEL_PROTOCOL: ${ADMIN_INVESTIGATION_MODEL_PROTOCOL:-openai-chat}
    ADMIN_INVESTIGATION_MODEL_NAME: ${ADMIN_INVESTIGATION_MODEL_NAME:-}
    ADMIN_INVESTIGATION_MODEL_MAX_TOKENS: ${ADMIN_INVESTIGATION_MODEL_MAX_TOKENS:-2000}
    ADMIN_INVESTIGATION_MODEL_PROVIDER: ${ADMIN_INVESTIGATION_MODEL_PROVIDER:-configured-model-gateway}
    ADMIN_INVESTIGATION_MODEL_VERSION: ${ADMIN_INVESTIGATION_MODEL_VERSION:-configured}
    ADMIN_INVESTIGATION_MODEL_PROMPT_REF: ${ADMIN_INVESTIGATION_MODEL_PROMPT_REF:-adaptive-investigation-v1}
  depends_on:
    migrate:
      condition: service_completed_successfully
    world-runtime:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-administrative}
    volumes:
      - administrative-production-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:-administrative}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    image: administrative-orchestrator:production
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # Explicit break-glass bootstrap only. It is never a dependency of normal
  # runtime services and must be invoked with `--profile bootstrap` once, then
  # the bootstrap payload must be removed from the deployment environment.
  foundation-bootstrap:
    profiles: ["bootstrap"]
    build: .
    image: administrative-orchestrator:production
    restart: "no"
    command: ["python", "-m", "administrative_orchestrator.bootstrap_foundation"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_AUTO_CREATE_SCHEMA: "false"
      ADMIN_BOOTSTRAP_AUTHORITY_JSON: ${ADMIN_BOOTSTRAP_AUTHORITY_JSON:?set only for explicit bootstrap}
    depends_on:
      migrate:
        condition: service_completed_successfully

  world-runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: administrative-world-runtime:production
    restart: unless-stopped
    environment:
      # The factory reads Administrative connector settings. World Runtime owns
      # generic authorization, durable attempts and the physical provider boundary.
      ADMIN_RUNTIME_PROFILE: production
      ADMIN_AUTH_MODE: oidc
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:?set ADMIN_OIDC_ISSUER}
      ADMIN_OIDC_AUDIENCE: ${ADMIN_OIDC_AUDIENCE:?set ADMIN_OIDC_AUDIENCE}
      ADMIN_OIDC_ALLOWED_ALGORITHMS: RS256,ES256
      ADMIN_ODOO_BASE_URL: ${ADMIN_ODOO_BASE_URL:?set ADMIN_ODOO_BASE_URL}
      ADMIN_ODOO_DATABASE: ${ADMIN_ODOO_DATABASE:?set ADMIN_ODOO_DATABASE}
      ADMIN_ODOO_WRITER_USERNAME: ${ADMIN_ODOO_WRITER_USERNAME:?set ADMIN_ODOO_WRITER_USERNAME}
      ADMIN_ODOO_WRITER_SECRET: ${ADMIN_ODOO_WRITER_SECRET:?inject ADMIN_ODOO_WRITER_SECRET}
      ADMIN_ODOO_VERIFIER_USERNAME: ${ADMIN_ODOO_VERIFIER_USERNAME:?set ADMIN_ODOO_VERIFIER_USERNAME}
      ADMIN_ODOO_VERIFIER_SECRET: ${ADMIN_ODOO_VERIFIER_SECRET:?inject ADMIN_ODOO_VERIFIER_SECRET}
      ADMIN_ODOO_FINANCIAL_WRITER_USERNAME: ${ADMIN_ODOO_FINANCIAL_WRITER_USERNAME:?set ADMIN_ODOO_FINANCIAL_WRITER_USERNAME}
      ADMIN_ODOO_FINANCIAL_WRITER_SECRET: ${ADMIN_ODOO_FINANCIAL_WRITER_SECRET:?inject ADMIN_ODOO_FINANCIAL_WRITER_SECRET}
      ADMIN_ODOO_FINANCIAL_VERIFIER_USERNAME: ${ADMIN_ODOO_FINANCIAL_VERIFIER_USERNAME:?set ADMIN_ODOO_FINANCIAL_VERIFIER_USERNAME}
      ADMIN_ODOO_FINANCIAL_VERIFIER_SECRET: ${ADMIN_ODOO_FINANCIAL_VERIFIER_SECRET:?inject ADMIN_ODOO_FINANCIAL_VERIFIER_SECRET}
      ADMIN_ODOO_REQUEST_REF_FIELD: ${ADMIN_ODOO_REQUEST_REF_FIELD:-x_administrative_request_ref}
      ADMIN_ODOO_TRANSACTION_REQUEST_REF_FIELD: ${ADMIN_ODOO_TRANSACTION_REQUEST_REF_FIELD:-x_administrative_transaction_request_ref}
      ADMIN_ODOO_TRANSACTION_CONFIRM_REQUEST_REF_FIELD: ${ADMIN_ODOO_TRANSACTION_CONFIRM_REQUEST_REF_FIELD:-x_administrative_transaction_confirm_request_ref}
      ADMIN_ODOO_TRANSACTION_SUBJECT_REF_FIELD: ${ADMIN_ODOO_TRANSACTION_SUBJECT_REF_FIELD:-x_administrative_transaction_subject_ref}
      ADMIN_ODOO_TRANSACTION_PAYLOAD_FIELD: ${ADMIN_ODOO_TRANSACTION_PAYLOAD_FIELD:-x_administrative_m8_payload_json}
      ADMIN_KEYCLOAK_BASE_URL: ${ADMIN_KEYCLOAK_BASE_URL:?set ADMIN_KEYCLOAK_BASE_URL}
      ADMIN_KEYCLOAK_REALM: ${ADMIN_KEYCLOAK_REALM:?set ADMIN_KEYCLOAK_REALM}
      ADMIN_KEYCLOAK_WRITER_CLIENT_ID: ${ADMIN_KEYCLOAK_WRITER_CLIENT_ID:?set ADMIN_KEYCLOAK_WRITER_CLIENT_ID}
      ADMIN_KEYCLOAK_WRITER_SECRET: ${ADMIN_KEYCLOAK_WRITER_SECRET:?inject ADMIN_KEYCLOAK_WRITER_SECRET}
      ADMIN_KEYCLOAK_VERIFIER_CLIENT_ID: ${ADMIN_KEYCLOAK_VERIFIER_CLIENT_ID:?set ADMIN_KEYCLOAK_VERIFIER_CLIENT_ID}
      ADMIN_KEYCLOAK_VERIFIER_SECRET: ${ADMIN_KEYCLOAK_VERIFIER_SECRET:?inject ADMIN_KEYCLOAK_VERIFIER_SECRET}
      ADMIN_KEYCLOAK_REQUEST_REF_ATTRIBUTE: ${ADMIN_KEYCLOAK_REQUEST_REF_ATTRIBUTE:-administrative_request_ref}
      ADMIN_CONNECTOR_TIMEOUT_SECONDS: ${ADMIN_CONNECTOR_TIMEOUT_SECONDS:-10}
      WORLD_RUNTIME_FACTORY: scripts.production_world_runtime_stack:build
      WORLD_RUNTIME_ADMIN_PRODUCTION_STATE_PATH: /var/lib/world-runtime/world-runtime.db
    volumes:
      - administrative-world-runtime-state:/var/lib/world-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *admin-common
    build: .
    command: ["python", "-m", "uvicorn", "administrative_orchestrator.api_observed:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  operations-api:
    <<: *admin-common
    build: .
    command: ["python", "-m", "uvicorn", "administrative_orchestrator.operations_app:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *admin-common
    build: .
    command: ["python", "-m", "administrative_orchestrator.worker"]
    environment:
      <<: *admin-environment
      ADMIN_WORKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-administrative}
      ADMIN_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/administrative_dbos
      ADMIN_WORKER_POLL_SECONDS: ${ADMIN_WORKER_POLL_SECONDS:-1}
      # Worker-only Feishu app credentials are exchanged for short-lived
      # tenant tokens for canonical reads. Keep ingress verification material
      # separate from this provider read identity.
      ADMIN_FEISHU_APP_ID: ${ADMIN_FEISHU_APP_ID:-}
      ADMIN_FEISHU_APP_SECRET: ${ADMIN_FEISHU_APP_SECRET:-}
      ADMIN_FEISHU_APP_ID_FILE: ${ADMIN_FEISHU_APP_ID_FILE:-}
      ADMIN_FEISHU_APP_SECRET_FILE: ${ADMIN_FEISHU_APP_SECRET_FILE:-}
      # Explicit test/manual compatibility override; leave empty in normal V1
      # deployments when the app credential pair is configured.
      ADMIN_FEISHU_ACCESS_TOKEN: ${ADMIN_FEISHU_ACCESS_TOKEN:-}
      ADMIN_FEISHU_ARTIFACT_ROOT: ${ADMIN_FEISHU_ARTIFACT_ROOT:-/var/lib/administrative/intake-artifacts}
      ADMIN_INTAKE_MODEL_URL: ${ADMIN_INTAKE_MODEL_URL:-}
      ADMIN_INTAKE_MODEL_API_KEY: ${ADMIN_INTAKE_MODEL_API_KEY:-}
      ADMIN_INTAKE_MODEL_PROTOCOL: ${ADMIN_INTAKE_MODEL_PROTOCOL:-openai-chat}
      ADMIN_INTAKE_MODEL_NAME: ${ADMIN_INTAKE_MODEL_NAME:-}
      ADMIN_INTAKE_MODEL_MAX_TOKENS: ${ADMIN_INTAKE_MODEL_MAX_TOKENS:-2400}
    volumes:
      - administrative-intake-artifacts:/var/lib/administrative/intake-artifacts

  operations-console:
    build:
      context: operations-console
      args:
        VITE_OPERATIONS_API_BASE_URL: /api
        VITE_OIDC_AUTHORITY: ${ADMIN_OIDC_ISSUER:?set ADMIN_OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${ADMIN_OPERATIONS_OIDC_CLIENT_ID:?set ADMIN_OPERATIONS_OIDC_CLIENT_ID}
        VITE_OIDC_SCOPE: ${ADMIN_OPERATIONS_OIDC_SCOPE:-openid profile email}
    image: administrative-operations-console:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_OPERATIONS_CONSOLE_PORT:-8080}:80"
    depends_on:
      operations-api:
        condition: service_healthy

volumes:
  administrative-production-pgdata:
  administrative-world-runtime-state:
  administrative-intake-artifacts:
