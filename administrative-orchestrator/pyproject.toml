[project]
name = "administrative-orchestrator"
version = "1.0.0"
description = "Durable, governed administrative automation over organizational policy, approvals, effects, verification, and reopen."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "xiongweilin" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "dbos>=2.31,<3",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9,<3",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
runtime = [
  "world-runtime @ git+https://github.com/xiongweilin/aios.git@main#subdirectory=world-runtime",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6,<7",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/administrative_orchestrator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["I001"]
# Keep the accepted verifier branches visually separate: confirmed purchase
# state and draft-only creation are distinct semantic postconditions even
# though they currently assign the same projection field on mismatch.
"src/administrative_orchestrator/integrations/odoo_effects.py" = ["SIM114"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.dbos]
# Runtime values are supplied through environment variables.
