[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "world-runtime"
version = "1.1.0"
description = "Persistent semantic runtime for long-lived agency"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Xiongwei Lin"}]
dependencies = [
  "semantic-language @ git+https://github.com/xiongweilin/aios.git@main#subdirectory=semantic-language",
  "fastapi>=0.115",
  "pydantic>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=1", "pytest-cov>=5", "ruff>=0.7", "httpx>=0.27", "jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/world_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.hatch.metadata]
allow-direct-references = true
