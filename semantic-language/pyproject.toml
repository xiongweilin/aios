[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semantic-language"
version = "0.2.0"
description = "Small universal semantic kernel for human, institutional, and machine agency"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Xiongwei Lin"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_language"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]
