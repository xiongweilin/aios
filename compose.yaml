name: aios

x-aios-service: &aios-service
  build:
    context: .
    args:
      AIOS_APP_ROOT: ${AIOS_CONTAINER_APP_ROOT:?set AIOS_CONTAINER_APP_ROOT}
  image: aios:local
  restart: unless-stopped

x-administrative-environment: &administrative-environment
  ADMIN_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER:?set AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD:?set AIOS_POSTGRES_PASSWORD}@postgres:5432/administrative
  ADMIN_WORKER_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/administrative
  ADMIN_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/administrative_dbos
  ADMIN_ALEMBIC_SCRIPT_LOCATION: ${ADMIN_ALEMBIC_SCRIPT_LOCATION:?set ADMIN_ALEMBIC_SCRIPT_LOCATION}
  ADMIN_RUNTIME_PROFILE: ${ADMIN_RUNTIME_PROFILE:-development}
  ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-development}
  ADMIN_WORLD_RUNTIME_MODE: ${ADMIN_WORLD_RUNTIME_MODE:-disabled}
  ADMIN_AUTO_CREATE_SCHEMA: ${ADMIN_AUTO_CREATE_SCHEMA:-false}
  ADMIN_INTAKE_ARTIFACT_ROOT: ${ADMIN_INTAKE_ARTIFACT_ROOT:?set ADMIN_INTAKE_ARTIFACT_ROOT}
  ADMIN_INTAKE_MODEL_URL: ${ADMIN_INTAKE_MODEL_URL:-}
  ADMIN_INTAKE_MODEL_API_KEY: ${ADMIN_INTAKE_MODEL_API_KEY:-}
  ADMIN_INTAKE_MODEL_NAME: ${ADMIN_INTAKE_MODEL_NAME:-}

x-autodev-environment: &autodev-environment
  AUTODEV_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/autodev
  AUTODEV_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/autodev_dbos
  AUTODEV_ALEMBIC_SCRIPT_LOCATION: ${AUTODEV_ALEMBIC_SCRIPT_LOCATION:?set AUTODEV_ALEMBIC_SCRIPT_LOCATION}
  AUTODEV_DOCKER_NETWORK: ${AUTODEV_DOCKER_NETWORK:-aios_default}
  AUTODEV_STATE_ROOT: ${AUTODEV_STATE_ROOT:?set AUTODEV_STATE_ROOT}
  AUTODEV_WORKSPACE_ROOT: ${AUTODEV_WORKSPACE_ROOT:?set AUTODEV_WORKSPACE_ROOT}
  AUTODEV_API_HOST: ${AUTODEV_API_HOST:-0.0.0.0}
  AUTODEV_API_PORT: ${AUTODEV_API_PORT:-8765}
  AUTODEV_TELEMETRY_QUERIES: ${AUTODEV_TELEMETRY_QUERIES:-}
  AUTODEV_PROMETHEUS_BASE_URL: ${AUTODEV_PROMETHEUS_BASE_URL:-http://prometheus:9090}
  AUTODEV_OPERATOR_HMAC_SECRET_FILE: /run/secrets/operator-hmac
  AUTODEV_WORLD_RUNTIME_MODE: ${AUTODEV_WORLD_RUNTIME_MODE:-disabled}
  AUTODEV_PERSONAL_WORLD_MODE: ${AUTODEV_PERSONAL_WORLD_MODE:-disabled}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIOS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIOS_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: ${AIOS_CONTAINER_POSTGRES_DATA_ROOT:?set AIOS_CONTAINER_POSTGRES_DATA_ROOT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${AIOS_HOST_POSTGRES_DATA_ROOT:?set AIOS_HOST_POSTGRES_DATA_ROOT}:${AIOS_CONTAINER_POSTGRES_DATA_ROOT}

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - type: bind
        source: ./config/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus

  database-init:
    <<: *aios-service
    restart: "no"
    command: ["aios-init-databases"]
    environment:
      AIOS_POSTGRES_ADMIN_DSN: postgresql://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/postgres
      AIOS_POSTGRES_DATABASES: ${AIOS_POSTGRES_DATABASES:?set AIOS_POSTGRES_DATABASES}
    depends_on:
      postgres:
        condition: service_healthy

  personal-world:
    <<: *aios-service
    command: ["personal-world"]
    environment:
      PERSONAL_WORLD_HOST: ${PERSONAL_WORLD_HOST:-0.0.0.0}
      PERSONAL_WORLD_PORT: ${PERSONAL_WORLD_PORT:-8080}
      PERSONAL_WORLD_DATABASE_URL: postgresql+psycopg://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/personal_world
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully

  world-runtime:
    <<: *aios-service
    command: ["world-runtime"]
    environment:
      WORLD_RUNTIME_HOST: ${WORLD_RUNTIME_HOST:-0.0.0.0}
      WORLD_RUNTIME_PORT: ${WORLD_RUNTIME_PORT:-8086}
      WORLD_RUNTIME_POSTGRES_DSN: postgresql://${AIOS_POSTGRES_USER}:${AIOS_POSTGRES_PASSWORD}@postgres:5432/world_runtime
      WORLD_RUNTIME_POSTGRES_SCHEMA: ${WORLD_RUNTIME_POSTGRES_SCHEMA:-public}
      WORLD_RUNTIME_ROOT_PRINCIPAL: ${WORLD_RUNTIME_ROOT_PRINCIPAL:-human:owner}
    ports:
      - "127.0.0.1:18086:8086"
    depends_on:
      database-init:
        condition: service_completed_successfully

  control-plane:
    <<: *aios-service
    command: ["control-plane", "--host", "0.0.0.0", "--port", "18083"]
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?set CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_STATE_DB: ${CONTROL_PLANE_STATE_DB:?set CONTROL_PLANE_STATE_DB}
      CONTROL_PLANE_ARTIFACT_ROOT: ${CONTROL_PLANE_ARTIFACT_ROOT:?set CONTROL_PLANE_ARTIFACT_ROOT}
      CONTROL_PLANE_AGENT_SESSION_DIR: ${CONTROL_PLANE_AGENT_SESSION_DIR:?set CONTROL_PLANE_AGENT_SESSION_DIR}
      CONTROL_PLANE_AGENT_WORKTREE_ROOT: ${CONTROL_PLANE_AGENT_WORKTREE_ROOT:?set CONTROL_PLANE_AGENT_WORKTREE_ROOT}
      CONTROL_PLANE_GARBAGE_QUARANTINE_DIR: ${CONTROL_PLANE_GARBAGE_QUARANTINE_DIR:-}
      CONTROL_PLANE_REMOTE_SHA_CACHE_PATH: ${CONTROL_PLANE_REMOTE_SHA_CACHE_PATH:-}
      CONTROL_PLANE_WORLD_RUNTIME_BASE_URL: ${CONTROL_PLANE_WORLD_RUNTIME_BASE_URL:-http://world-runtime:8086}
      CONTROL_PLANE_WORLD_RUNTIME_BEARER_TOKEN: ${CONTROL_PLANE_WORLD_RUNTIME_BEARER_TOKEN:-}
      CONTROL_PLANE_WORLD_RUNTIME_DELEGATION_ID: ${CONTROL_PLANE_WORLD_RUNTIME_DELEGATION_ID:-}
      CONTROL_PLANE_AGENT_BASE_URL: ${CONTROL_PLANE_AGENT_BASE_URL:-}
      CONTROL_PLANE_AGENT_EXECUTABLE: ${CONTROL_PLANE_AGENT_EXECUTABLE:-}
      CONTROL_PLANE_CODEX_APP_SERVER_URL: ${CONTROL_PLANE_CODEX_APP_SERVER_URL:-}
      CONTROL_PLANE_CODEX_APP_SERVER_TOKEN_FILE: /run/secrets/codex-ws-token
      CONTROL_PLANE_CODEX_HOST_PATH_MAP_FILE: /run/secrets/control-plane-path-map.json
      CONTROL_PLANE_PROMETHEUS_URL: ${CONTROL_PLANE_PROMETHEUS_URL:-}
      CONTROL_PLANE_CHEZMOI_SOURCE_DIR: ${CONTROL_PLANE_CHEZMOI_SOURCE_DIR:-}
      CONTROL_PLANE_ENVIRONMENT_CHECKS: ${CONTROL_PLANE_ENVIRONMENT_CHECKS:-false}
      CONTROL_PLANE_NOTIFICATIONS: ${CONTROL_PLANE_NOTIFICATIONS:-false}
    ports:
      - "127.0.0.1:18083:18083"
    volumes:
      - ${CONTROL_PLANE_HOST_DATA_ROOT:?set CONTROL_PLANE_HOST_DATA_ROOT}:${CONTROL_PLANE_DATA_ROOT:?set CONTROL_PLANE_DATA_ROOT}
      - type: bind
        source: ${AIOS_HOST_CODEX_APP_SERVER_TOKEN_FILE:?set AIOS_HOST_CODEX_APP_SERVER_TOKEN_FILE}
        target: /run/secrets/codex-ws-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTROL_PLANE_HOST_CODEX_PATH_MAP_FILE:?set CONTROL_PLANE_HOST_CODEX_PATH_MAP_FILE}
        target: /run/secrets/control-plane-path-map.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      world-runtime:
        condition: service_started
      prometheus:
        condition: service_started

  administrative-migrate:
    <<: *aios-service
    restart: "no"
    command: ["aios-migrate"]
    environment:
      <<: *administrative-environment
      AIOS_MIGRATION_COMPONENT: administrative
    depends_on:
      database-init:
        condition: service_completed_successfully

  administrative-api:
    <<: *aios-service
    command:
      ["python", "-m", "uvicorn", "administrative_orchestrator.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *administrative-environment
    ports:
      - "127.0.0.1:18100:8000"
    volumes:
      - ${ADMIN_HOST_ARTIFACT_ROOT:?set ADMIN_HOST_ARTIFACT_ROOT}:${ADMIN_INTAKE_ARTIFACT_ROOT}
    depends_on:
      administrative-migrate:
        condition: service_completed_successfully

  administrative-worker:
    <<: *aios-service
    command: ["python", "-m", "administrative_orchestrator.worker"]
    environment:
      <<: *administrative-environment
    volumes:
      - ${ADMIN_HOST_ARTIFACT_ROOT}:${ADMIN_INTAKE_ARTIFACT_ROOT}
    depends_on:
      administrative-migrate:
        condition: service_completed_successfully

  autodev-migrate:
    <<: *aios-service
    restart: "no"
    command: ["aios-migrate"]
    environment:
      <<: *autodev-environment
      AIOS_MIGRATION_COMPONENT: autonomous-development
    depends_on:
      database-init:
        condition: service_completed_successfully

  autonomous-development:
    <<: *aios-service
    command: ["autonomous-development", "serve"]
    environment:
      <<: *autodev-environment
      DOCKER_HOST: unix://${AUTODEV_DOCKER_SOCKET:?set AUTODEV_DOCKER_SOCKET}
      AUTODEV_CODEX_APP_SERVER_URL: ${AUTODEV_CODEX_APP_SERVER_URL:-}
      AUTODEV_CODEX_APP_SERVER_TOKEN_FILE: /run/secrets/codex-ws-token
      AUTODEV_CODEX_HOST_PATH_MAP_FILE: /run/secrets/autodev-path-map.json
      AUTODEV_OPERATOR_HMAC_SECRET_FILE: /run/secrets/operator-hmac
    ports:
      - "127.0.0.1:18110:8765"
    volumes:
      - ${AUTODEV_HOST_STATE_ROOT:?set AUTODEV_HOST_STATE_ROOT}:${AUTODEV_STATE_ROOT}
      - ${AUTODEV_HOST_WORKSPACE_ROOT:?set AUTODEV_HOST_WORKSPACE_ROOT}:${AUTODEV_WORKSPACE_ROOT:?set AUTODEV_WORKSPACE_ROOT}
      - ${AUTODEV_HOST_DOCKER_SOCKET:?set AUTODEV_HOST_DOCKER_SOCKET}:${AUTODEV_DOCKER_SOCKET}
      - type: bind
        source: ${AIOS_HOST_CODEX_APP_SERVER_TOKEN_FILE:?set AIOS_HOST_CODEX_APP_SERVER_TOKEN_FILE}
        target: /run/secrets/codex-ws-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTODEV_HOST_CODEX_PATH_MAP_FILE:?set AUTODEV_HOST_CODEX_PATH_MAP_FILE}
        target: /run/secrets/autodev-path-map.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AIOS_HOST_OPERATOR_HMAC_SECRET_FILE:?set AIOS_HOST_OPERATOR_HMAC_SECRET_FILE}
        target: /run/secrets/operator-hmac
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      autodev-migrate:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

volumes:
  prometheus_data:
