name: aios

x-aios-service: &aios-service
  build: .
  image: aios:local
  restart: unless-stopped

x-administrative-environment: &administrative-environment
  ADMIN_DATABASE_URL: postgresql+psycopg://aios:aios-internal@postgres:5432/administrative
  ADMIN_WORKER_DATABASE_URL: postgresql+psycopg://aios:aios-internal@postgres:5432/administrative
  ADMIN_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://aios:aios-internal@postgres:5432/administrative_dbos
  ADMIN_RUNTIME_PROFILE: development
  ADMIN_AUTH_MODE: development
  ADMIN_WORLD_RUNTIME_MODE: disabled
  ADMIN_AUTO_CREATE_SCHEMA: "false"
  ADMIN_INTAKE_ARTIFACT_ROOT: /var/lib/aios/intake-artifacts
  ADMIN_INTAKE_MODEL_URL: ${ADMIN_INTAKE_MODEL_URL:-}
  ADMIN_INTAKE_MODEL_API_KEY: ${ADMIN_INTAKE_MODEL_API_KEY:-}
  ADMIN_INTAKE_MODEL_NAME: ${ADMIN_INTAKE_MODEL_NAME:-}

x-autodev-environment: &autodev-environment
  AUTODEV_DATABASE_URL: postgresql+psycopg://aios:aios-internal@postgres:5432/autodev
  AUTODEV_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://aios:aios-internal@postgres:5432/autodev_dbos
  AUTODEV_STATE_ROOT: /var/lib/aios
  AUTODEV_API_HOST: 0.0.0.0
  AUTODEV_API_PORT: "8765"
  AUTODEV_WORLD_RUNTIME_MODE: disabled
  AUTODEV_PERSONAL_WORLD_MODE: disabled

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios-internal
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-aios-databases.sql:ro

  personal-world:
    <<: *aios-service
    command: ["personal-world"]
    environment:
      PERSONAL_WORLD_HOST: 0.0.0.0
      PERSONAL_WORLD_PORT: "8080"
      PERSONAL_WORLD_DATABASE_URL: sqlite:////var/lib/aios/personal-world.db
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - personal-world-data:/var/lib/aios

  world-runtime:
    <<: *aios-service
    command: ["world-runtime"]
    environment:
      WORLD_RUNTIME_HOST: 0.0.0.0
      WORLD_RUNTIME_PORT: "8086"
      WORLD_RUNTIME_SQLITE_PATH: /var/lib/aios/world-runtime.db
      WORLD_RUNTIME_ROOT_PRINCIPAL: ${WORLD_RUNTIME_ROOT_PRINCIPAL:-human:owner}
    ports:
      - "127.0.0.1:18086:8086"
    volumes:
      - world-runtime-data:/var/lib/aios

  control-plane:
    <<: *aios-service
    command: ["control-plane", "--config", "/app/config/domains/control_plane.container.toml", "--host", "0.0.0.0", "--port", "18083"]
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-local-aios}
      CONTROL_PLANE_WORLD_RUNTIME_BEARER_TOKEN: ${CONTROL_PLANE_WORLD_RUNTIME_BEARER_TOKEN:-}
      CONTROL_PLANE_WORLD_RUNTIME_DELEGATION_ID: ${CONTROL_PLANE_WORLD_RUNTIME_DELEGATION_ID:-}
    ports:
      - "127.0.0.1:18083:18083"
    volumes:
      - control-plane-data:/var/lib/aios
    depends_on:
      world-runtime:
        condition: service_started

  administrative-migrate:
    <<: *aios-service
    restart: "no"
    command:
      ["alembic", "-c", "config/domains/administrative/alembic.ini", "upgrade", "head"]
    environment:
      <<: *administrative-environment
    depends_on:
      postgres:
        condition: service_healthy

  administrative-api:
    <<: *aios-service
    command:
      ["python", "-m", "uvicorn", "administrative_orchestrator.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *administrative-environment
    ports:
      - "127.0.0.1:18100:8000"
    volumes:
      - administrative-data:/var/lib/aios
    depends_on:
      administrative-migrate:
        condition: service_completed_successfully

  administrative-worker:
    <<: *aios-service
    command: ["python", "-m", "administrative_orchestrator.worker"]
    environment:
      <<: *administrative-environment
    volumes:
      - administrative-data:/var/lib/aios
    depends_on:
      administrative-migrate:
        condition: service_completed_successfully

  autodev-migrate:
    <<: *aios-service
    restart: "no"
    command:
      ["alembic", "-c", "config/domains/autonomous_development/alembic.ini", "upgrade", "head"]
    environment:
      <<: *autodev-environment
    depends_on:
      postgres:
        condition: service_healthy

  autonomous-development:
    <<: *aios-service
    command: ["autonomous-development", "serve"]
    environment:
      <<: *autodev-environment
    ports:
      - "127.0.0.1:18110:8765"
    volumes:
      - autonomous-development-data:/var/lib/aios
      - ${AUTODEV_WORKSPACE_PATH:-.}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      autodev-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  personal-world-data:
  world-runtime-data:
  control-plane-data:
  administrative-data:
  autonomous-development-data:
