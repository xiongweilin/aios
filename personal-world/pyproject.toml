[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-world"
version = "1.0.0"
description = "Durable, user-owned representation of one person's evolving world"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Xiongwei Lin"}]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
  "semantic-language @ git+https://github.com/xiongweilin/aios.git@9c0c391adae2bfb8c2b2beaa3c4bba8f6a9cef90#subdirectory=semantic-language",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.140,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
personal-world = "personal_world.api.app:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/personal_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires PostgreSQL integration database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["personal_world"]
exclude = ["src/personal_world/api/app.py"]

[tool.ruff.lint.per-file-ignores]
"src/personal_world/api/app.py" = ["B008"]
